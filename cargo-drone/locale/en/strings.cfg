[mod-setting-description]
cargo-drone-inventory-size=Changes the amount of inventory slots inside [item=cargo-drone]Cargo drones.
cargo-drone-fuel-inventory-size=Changes the amount of fuel slots inside [item=cargo-drone]Cargo drones.
cargo-drone-burnt-result-inventory-size=Changes the amount of burnt result slots inside [item=cargo-drone]Cargo drones.\nNote that [item=cargo-drone]Cargo drones will try to unload burnt results at [item=cargo-drone-mooring-constant-combinator-refueler]Refueler moorings and will not undock until the burnt result slots are empty.\n[item=cargo-drone]Cargo drones does not take the amount of burnt results into consideration when deciding when to head to [item=cargo-drone-mooring-constant-combinator-refueler]Refueler moorings.
cargo-drone-fuel-interrupt-percentage=The percentage of fuel that will cause the Cargo drone to be interrupted and head towards a [item=cargo-drone-mooring-constant-combinator-refueler]Refueler mooring.
cargo-drone-mooring-no-wire-connection-alert=Enable alerts for Provider and Requester moorings with no wire attached.
cargo-drone-stuck-at-refueler-seconds-alert=The amount of seconds a [item=cargo-drone]Cargo drone need to be docked to a [item=cargo-drone-mooring-constant-combinator-refueler]Refueler mooring before an alert is sent saying that the [item=cargo-drone]Cargo drone is stuck.\nSet to 0 to disable.
cargo-drone-heuristic-target-count-cost=Used when deciding which mooring a drone should go to. When selecting a mooring, it is based on distance but with an increased cost for each [item=cargo-drone]Cargo drone currently tasked with heading to the mooring by this amount.\nHigher values makes [item=cargo-drone]Cargo drones try to spread out more, while lower values make them head towards the same.
cargo-drone-min-schedule-interval=The minimum amount of ticks that must pass before the trying to schedule tasks for [item=cargo-drone]Cargo drones.\nA higher value can make it take longer for [item=cargo-drone]Cargo drones to be assigned to new tasks, but may increase the time between lag spikes from scheduling.\nA lower value can make [item=cargo-drone]Cargo drones be assigned faster, but may decrease the time between lag spikes from scheduling.
