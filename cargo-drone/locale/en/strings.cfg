[cargo-drone-migration]
warning-wires-removed=Warning. Due to a migration issue when updating cargo-drone from a version prior to 1.4.0, all circuit wires connected to moorings have been removed and will need to be replaced. Note that drone limit and priority must now be configured in the moorings. Sorry for the inconvenience.
warning-read-inventory-output-removed= Warning. The inventory targeted by moorings was changed in 1.5.0 and is now configured inside the mooring GUI. This means that Refueler moorings no longer output the read inventory, so any Refueler that depends on this behavior will no longer work.

